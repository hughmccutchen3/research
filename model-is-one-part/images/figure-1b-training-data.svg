<svg xmlns="http://www.w3.org/2000/svg" width="510" height="470" viewBox="0 0 510 470" font-family="Segoe UI, Arial, sans-serif" style="background:#ffffff" xmlns:c2pa="http://c2pa.org/manifest">
<title id="f1b-title">Figure 1b · What goes into training</title>
<desc id="f1b-desc">Eight sources of training data a lab can draw on: public web, books, code, licensed and partner data, consumer chats (where users allow it), business and API data (if customers share it), human-written examples and ratings, and synthetic data written by models. They sit inside a dashed frame labelled filtering and mix: what is removed, and how often each source is used. An arrow leads from the frame to training. OpenAI and Anthropic do not publish how much comes from each source.</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0f766e"/></marker></defs>
<rect x="0" y="0" width="510" height="470" fill="#ffffff" style="pointer-events: none;"/>
<g id="panels">
<rect x="20" y="20" width="470" height="430" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" style="pointer-events: none;"/>
</g>
<text x="40" y="48" font-size="14" font-weight="700" fill="#1e293b">Sources a lab can draw on</text>
<text x="40" y="66" font-size="11" font-weight="400" fill="#475569">OpenAI and Anthropic do not publish how much comes from each</text>
<rect x="36" y="80" width="438" height="300" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="255" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e">Filtering and mix</text>
<text x="255" y="115" text-anchor="middle" font-size="10" font-weight="400" fill="#0f766e">what is removed, and how often each source is used</text>
<g id="src-1"><rect x="56" y="128" width="192" height="46" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="152" y="155" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1e3a8a">Public web</text>
</g>
<g id="src-2"><rect x="262" y="128" width="192" height="46" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="358" y="155" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1e3a8a">Books</text>
</g>
<g id="src-3"><rect x="56" y="188" width="192" height="46" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="152" y="215" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1e3a8a">Code</text>
</g>
<g id="src-4"><rect x="262" y="188" width="192" height="46" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="358" y="215" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1e3a8a">Licensed and partner data</text>
</g>
<g id="src-5"><rect x="56" y="248" width="192" height="46" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="152" y="268" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1e3a8a">Consumer chats</text>
<text x="152" y="282" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1e3a8a">(where users allow it)</text>
</g>
<g id="src-6"><rect x="262" y="248" width="192" height="46" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="358" y="268" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1e3a8a">Business and API data</text>
<text x="358" y="282" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1e3a8a">(if customers share it)</text>
</g>
<g id="src-7"><rect x="56" y="308" width="192" height="46" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="152" y="328" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1e3a8a">Human-written examples</text>
<text x="152" y="342" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1e3a8a">and ratings</text>
</g>
<g id="src-8"><rect x="262" y="308" width="192" height="46" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="358" y="328" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1e3a8a">Synthetic data</text>
<text x="358" y="342" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1e3a8a">(written by models)</text>
</g>
