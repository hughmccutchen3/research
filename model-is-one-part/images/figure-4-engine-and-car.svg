<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect x="0" y="0" width="800" height="520" fill="#FFFFFF"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4A5568"/>
    </marker>
  </defs>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1A202C">The Engine and the Car</text>

  <rect x="40" y="52" width="320" height="58" rx="8" fill="#EDF2F7" stroke="#4A5568" stroke-width="1.5"/>
  <text x="200" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A202C">1. Pretraining (cast)</text>
  <text x="200" y="97" text-anchor="middle" font-size="12" fill="#2D3748">predict the next piece of text, at scale</text>
  <rect x="440" y="52" width="320" height="58" rx="8" fill="#EDF2F7" stroke="#4A5568" stroke-width="1.5"/>
  <text x="600" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A202C">2. Post-training (tuned)</text>
  <text x="600" y="97" text-anchor="middle" font-size="12" fill="#2D3748">feedback from people and written guidelines</text>
  <line x1="360" y1="81" x2="436" y2="81" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="40" y="150" width="720" height="350" rx="14" fill="#F7FAFC" stroke="#2B6CB0" stroke-width="2"/>
  <text x="60" y="174" font-size="14" font-weight="bold" fill="#2B6CB0">The product around the model (the car)</text>

  <path d="M600,110 L600,130 L400,130 L400,266" fill="none" stroke="#4A5568" stroke-width="2" marker-end="url(#arr)"/>
  <text x="410" y="222" font-size="12" font-style="italic" fill="#4A5568">sealed</text>

  <rect x="300" y="270" width="200" height="80" rx="10" fill="#FEEBC8" stroke="#C05621" stroke-width="2"/>
  <text x="400" y="303" text-anchor="middle" font-size="15" font-weight="bold" fill="#7B341E">The model (engine)</text>
  <text x="400" y="325" text-anchor="middle" font-size="12" fill="#7B341E">weights fixed after training</text>

  <line x1="270" y1="225" x2="300" y2="285" stroke="#718096" stroke-width="1.5"/>
  <line x1="530" y1="225" x2="500" y2="285" stroke="#718096" stroke-width="1.5"/>
  <line x1="270" y1="405" x2="300" y2="335" stroke="#718096" stroke-width="1.5"/>
  <line x1="530" y1="405" x2="500" y2="335" stroke="#718096" stroke-width="1.5"/>

  <rect x="70" y="195" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="170" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A202C">System prompt</text>
  <text x="170" y="240" text-anchor="middle" font-size="12" fill="#2D3748">route and driving style</text>

  <rect x="530" y="195" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="630" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A202C">Context window</text>
  <text x="630" y="240" text-anchor="middle" font-size="12" fill="#2D3748">windshield: chat, files, memory</text>

  <rect x="70" y="375" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="170" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A202C">Tools</text>
  <text x="170" y="420" text-anchor="middle" font-size="12" fill="#2D3748">wheels: search, code, files</text>

  <rect x="530" y="375" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="630" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A202C">Safety checks, permissions</text>
  <text x="630" y="420" text-anchor="middle" font-size="12" fill="#2D3748">brakes</text>

  <text x="400" y="478" text-anchor="middle" font-size="13" font-style="italic" fill="#2B6CB0">Same engine, different car: different behaviour</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
