<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" role="img" aria-labelledby="ti de" style="background:#ffffff;font-family:'Segoe UI',Helvetica,Arial,sans-serif">
<title id="ti">Which parts of a system are trained and which are rule-based</title>
<desc id="de">A reusable left-to-right pipeline schematic with five stages: input, preparation, model, post-processing, destination. Two worked examples show the same five stages shaded by whether each was trained from data, hand-coded as rules, or performed by a person. Only the preparation stage changes shading between the two examples — Karpathy's substitution happening to one component while the rest of the pipeline stays code.</desc>
<rect x="0" y="0" width="980" height="400" fill="#ffffff"/>
<text x="20" y="30" font-size="15" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1e293b">Which parts of a system are trained and which are rule-based</text>
<text x="20" y="50" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#475569">The same five-stage schematic recurs on every case in the paper, shaded by that case's own record. Two worked examples below show how the shading works.</text>

<defs>
  <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0,8 3,0 6" fill="#777777"/>
  </marker>
</defs>

<!-- Example A -->
<text x="20" y="80" font-size="10.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#2c2c2a">Example A — a 2015 hand-built system</text>

<rect x="20" y="90" width="164" height="56" rx="6" fill="#a8d4f2" stroke="#2d6eaa" stroke-width="1.25"/>
<text x="102" y="122" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1e293b">Input</text>
<line x1="184" y1="118" x2="212" y2="118" stroke="#777777" stroke-width="1.5" marker-end="url(#arr-gray)"/>

<rect x="220" y="90" width="164" height="56" rx="6" fill="#a8d4f2" stroke="#2d6eaa" stroke-width="1.25"/>
<text x="302" y="116" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1e293b">Preparation</text>
<text x="302" y="130" text-anchor="middle" font-size="8" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">hand-chosen features</text>
<line x1="384" y1="118" x2="412" y2="118" stroke="#777777" stroke-width="1.5" marker-end="url(#arr-gray)"/>

<rect x="420" y="90" width="164" height="56" rx="6" fill="#d3b3f0" stroke="#5b3d9e" stroke-width="1.25"/>
<text x="502" y="122" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1e293b">Model</text>
<line x1="584" y1="118" x2="612" y2="118" stroke="#777777" stroke-width="1.5" marker-end="url(#arr-gray)"/>

<rect x="620" y="90" width="164" height="56" rx="6" fill="#a8d4f2" stroke="#2d6eaa" stroke-width="1.25"/>
<text x="702" y="122" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1e293b">Post-processing</text>
<line x1="784" y1="118" x2="812" y2="118" stroke="#777777" stroke-width="1.5" marker-end="url(#arr-gray)"/>

<rect x="820" y="90" width="140" height="56" rx="6" fill="#a8d4f2" stroke="#2d6eaa" stroke-width="1.25"/>
<text x="890" y="122" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1e293b">Destination</text>

<!-- Example B -->
<text x="20" y="192" font-size="10.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#2c2c2a">Example B — a 2023 pre-trained, adapted system</text>

<rect x="20" y="202" width="164" height="56" rx="6" fill="#a8d4f2" stroke="#2d6eaa" stroke-width="1.25"/>
<text x="102" y="234" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1e293b">Input</text>
<line x1="184" y1="230" x2="212" y2="230" stroke="#777777" stroke-width="1.5" marker-end="url(#arr-gray)"/>

<rect x="220" y="202" width="164" height="56" rx="6" fill="#d3b3f0" stroke="#5b3d9e" stroke-width="1.25"/>
<text x="302" y="228" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1e293b">Preparation</text>
<text x="302" y="242" text-anchor="middle" font-size="8" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#4a2d8a">learned representations</text>
<line x1="384" y1="230" x2="412" y2="230" stroke="#777777" stroke-width="1.5" marker-end="url(#arr-gray)"/>

<rect x="420" y="202" width="164" height="56" rx="6" fill="#d3b3f0" stroke="#5b3d9e" stroke-width="1.25"/>
<text x="502" y="234" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1e293b">Model</text>
<line x1="584" y1="230" x2="612" y2="230" stroke="#777777" stroke-width="1.5" marker-end="url(#arr-gray)"/>

<rect x="620" y="202" width="164" height="56" rx="6" fill="#a8d4f2" stroke="#2d6eaa" stroke-width="1.25"/>
<text x="702" y="234" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1e293b">Post-processing</text>
<line x1="784" y1="230" x2="812" y2="230" stroke="#777777" stroke-width="1.5" marker-end="url(#arr-gray)"/>

<rect x="820" y="202" width="140" height="56" rx="6" fill="#a8d4f2" stroke="#2d6eaa" stroke-width="1.25"/>
<text x="890" y="234" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1e293b">Destination</text>

<text x="20" y="278" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#5f5e5a">Only preparation changes shading between the two examples. The substitution happens to one component. The rest of the pipeline stays rule-based.</text>

<!-- Legend -->
<text x="20" y="312" font-size="9.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#5f5e5a" letter-spacing="0.08em">LEGEND — HOW A STAGE IS SHADED</text>

<rect x="20" y="324" width="18" height="18" rx="3" fill="#d3b3f0" stroke="#5b3d9e" stroke-width="1"/>
<text x="46" y="337" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c2c2a">Trained from data</text>

<rect x="220" y="324" width="18" height="18" rx="3" fill="#a8d4f2" stroke="#2d6eaa" stroke-width="1"/>
<text x="246" y="337" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c2c2a">Rule-based code</text>

<rect x="450" y="324" width="18" height="18" rx="3" fill="#fdf6e3" stroke="#b8860b" stroke-width="1"/>
<text x="476" y="337" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c2c2a">Performed by a person</text>

<rect x="680" y="324" width="18" height="18" rx="3" fill="#f1efe8" stroke="#888780" stroke-width="1" stroke-dasharray="3,2"/>
<text x="706" y="337" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c2c2a">Not stated in the record</text>

<text x="20" y="368" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#888780">Each case's own version of this figure shades the five boxes by its own evidence; a stage the sources are silent on is marked not stated, never guessed.</text>
</svg>
