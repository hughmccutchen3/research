<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="980" height="580" role="img" aria-labelledby="ti de" style="background:#ffffff;font-family:'Segoe UI',Helvetica,Arial,sans-serif">
<title id="ti">Which family of methods fits which kind of problem</title>
<desc id="de">A two-by-two grid. Horizontal axis: kind of data, structured tabular records on the left, unstructured text and audio on the right. Vertical axis: shape of demand, one narrow stable question at top, many open-ended questions at bottom. Each quadrant names its method families and states whether it was open before 2019 or closed before 2019 and opened after.</desc>
<rect x="0" y="0" width="980" height="580" fill="#ffffff"/>
<text x="20" y="30" font-size="15" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1e293b">Which family of methods fits which kind of problem</text>
<text x="20" y="50" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#475569">Two axes: the kind of data, and the shape of demand for answers. Each quadrant states its method families and when it opened as a use case.</text>

<text x="530" y="72" text-anchor="middle" font-size="9.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#5f5e5a" letter-spacing="0.1em">KIND OF DATA</text>
<text x="330" y="94" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#2c2c2a">Structured, tabular</text>
<text x="730" y="94" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#2c2c2a">Unstructured — text, audio</text>

<text x="25" y="315" text-anchor="middle" font-size="9.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#5f5e5a" letter-spacing="0.1em" transform="rotate(-90 25 315)">SHAPE OF DEMAND</text>
<text x="62" y="205" text-anchor="middle" font-size="10" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#2c2c2a" transform="rotate(-90 62 205)">One narrow, stable question</text>
<text x="62" y="425" text-anchor="middle" font-size="10" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#2c2c2a" transform="rotate(-90 62 425)">Many open-ended questions</text>

<!-- top-left -->
<rect x="140" y="110" width="380" height="190" rx="6" fill="#ddf0e8" stroke="#2a7a50" stroke-width="1.5"/>
<rect x="156" y="126" width="164" height="22" rx="4" fill="#133d26"/>
<text x="238" y="142" text-anchor="middle" font-size="9.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#ffffff">OPEN THE WHOLE PERIOD</text>
<text x="160" y="174" font-size="11" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#1e5c38">Gradient boosted trees, random forests,</text>
<text x="160" y="192" font-size="11" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#1e5c38">logistic regression, and the parametric</text>
<text x="160" y="210" font-size="11" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#1e5c38">models they pair with. Trained per problem.</text>
<text x="160" y="234" font-size="11" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#1e5c38">The quadrant where trees still win.</text>

<!-- top-right -->
<rect x="540" y="110" width="380" height="190" rx="6" fill="#d3b3f0" stroke="#5b3d9e" stroke-width="1.5"/>
<rect x="556" y="126" width="220" height="22" rx="4" fill="#2e1060"/>
<text x="666" y="142" text-anchor="middle" font-size="9.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#ffffff">CLOSED BEFORE 2019 → OPENED AFTER</text>
<text x="560" y="174" font-size="11" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#4a2d8a">Before: hand-built rules and hand-designed</text>
<text x="560" y="192" font-size="11" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#4a2d8a">features, narrow and expensive. After: one</text>
<text x="560" y="210" font-size="11" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#4a2d8a">pre-trained model, adapted cheaply to each</text>
<text x="560" y="228" font-size="11" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#4a2d8a">new question.</text>

<!-- bottom-left -->
<rect x="140" y="330" width="380" height="190" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/>
<rect x="156" y="346" width="290" height="22" rx="4" fill="#5a3e00"/>
<text x="301" y="362" text-anchor="middle" font-size="9.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#ffffff">OPEN THE WHOLE PERIOD — BOUND BY HEADCOUNT</text>
<text x="160" y="394" font-size="11" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#5a3e00">Many separate small models, each cheap to</text>
<text x="160" y="412" font-size="11" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#5a3e00">train but each needing its own labels,</text>
<text x="160" y="430" font-size="11" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#5a3e00">pipeline and maintenance. Bounded by</text>
<text x="160" y="448" font-size="11" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#5a3e00">headcount, not by data.</text>

<!-- bottom-right -->
<rect x="540" y="330" width="380" height="190" rx="6" fill="#a8d4f2" stroke="#2d6eaa" stroke-width="1.5"/>
<rect x="556" y="346" width="220" height="22" rx="4" fill="#0c447c"/>
<text x="666" y="362" text-anchor="middle" font-size="9.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#ffffff">CLOSED BEFORE 2019 → OPENED AFTER</text>
<text x="560" y="394" font-size="11" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">Effectively closed — a separate model per</text>
<text x="560" y="412" font-size="11" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">question could not be justified. Opened</text>
<text x="560" y="430" font-size="11" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">by pre-training and cheap adaptation.</text>

<text x="20" y="558" font-size="9.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#5f5e5a">"Closed before 2019 → opened after" means the use case was not economically viable before cheap adaptation existed and became viable once it did — not that the technology itself was unavailable.</text>
</svg>
