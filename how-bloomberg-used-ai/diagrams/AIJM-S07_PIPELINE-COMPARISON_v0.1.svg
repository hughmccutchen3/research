<rect x="480" y="276" width="150" height="64" rx="5" fill="none" stroke="#5b3d9e" stroke-width="1.1"/>
<rect x="640" y="276" width="150" height="64" rx="5" fill="#a8d4f2" stroke="#2d6eaa" stroke-width="1.1"/>
<rect x="800" y="276" width="150" height="64" rx="5" fill="#a8d4f2" stroke="#2d6eaa" stroke-width="1.1"/>
<text x="555" y="312" text-anchor="middle" font-size="8" font-family="Segoe UI, Arial, sans-serif" fill="#1e293b">ML + rules-based</text>
<text x="235" y="312" text-anchor="middle" font-size="8" font-family="Segoe UI, Arial, sans-serif" fill="#1e293b">Iceberg + Trino</text>
<text x="715" y="312" text-anchor="middle" font-size="8" font-family="Segoe UI, Arial, sans-serif" fill="#1e293b">regression tests</text>

