<rect x="160" y="276" width="150" height="64" rx="5" fill="#a8d4f2" stroke="#2d6eaa" stroke-width="1.1"/>
<rect x="320" y="276" width="150" height="64" rx="5" fill="#f1efe8" stroke="#888780" stroke-width="1.1" stroke-dasharray="4,3"/>
<rect x="480" y="276" width="75" height="64" fill="#d3b3f0" stroke="none"/>
