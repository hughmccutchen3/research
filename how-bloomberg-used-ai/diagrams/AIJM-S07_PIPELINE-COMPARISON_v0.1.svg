<rect x="160" y="364" width="16" height="16" fill="#a8d4f2" stroke="#2d6eaa" stroke-width="1"/>
<text x="182" y="376" font-size="9" font-family="Segoe UI, Arial, sans-serif" fill="#1e293b">Written</text>
<rect x="240" y="364" width="16" height="16" fill="#d3b3f0" stroke="#5b3d9e" stroke-width="1"/>
