<svg xmlns="http://www.w3.org/2000/svg" width="820" height="708" viewBox="0 0 820 708" role="img" aria-labelledby="ttl dsc" style="background:#ffffff">
<title id="ttl">Three loops: the LLM works only in the turn loop</title>
<desc id="dsc">Three stacked loops. Turn loop, minutes: a request goes to the LLM, an optional automatic check, then a response. Session loop, hours: the person reviews and checks before anything enters the record, which the next turn reads. Rules loop, days: the person turns a lesson into a standing rule in the instructions, which later sessions read. Only the rules loop writes to the instructions.</desc>
<defs>
<marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d6eaa"/></marker>
<marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D85A30"/></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D9E75"/></marker>
<marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3d9e"/></marker>
<marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/></marker>
</defs>
<rect width="820" height="708" fill="#FFFFFF"/>
<text x="20" y="28" font-size="16" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#2C2C2A" text-anchor="start">Figure 1 · Three loops: the LLM works only in the turn loop</text>
<rect x="20" y="50" width="780" height="200" rx="10" fill="#F1F6FB" stroke="#2d6eaa" stroke-width="1.3"/>
<rect x="20" y="262" width="780" height="170" rx="10" fill="#F7FBF9" stroke="#1D9E75" stroke-width="1.3"/>
<rect x="20" y="444" width="780" height="170" rx="10" fill="#F5F1FB" stroke="#5b3d9e" stroke-width="1.3"/>
<path d="M744,50 H790 A10,10 0 0 1 800,60 V240 A10,10 0 0 1 790,250 H744 Z" fill="#1f5a8f"/>
<text transform="translate(762,150.0) rotate(90)" text-anchor="middle" font-size="30" font-weight="800" letter-spacing="5" font-family="Segoe UI, Arial, sans-serif" fill="#FFFFFF">MINUTES</text>
<path d="M744,262 H790 A10,10 0 0 1 800,272 V422 A10,10 0 0 1 790,432 H744 Z" fill="#14785a"/>
<text transform="translate(762,347.0) rotate(90)" text-anchor="middle" font-size="30" font-weight="800" letter-spacing="5" font-family="Segoe UI, Arial, sans-serif" fill="#FFFFFF">HOURS</text>
<path d="M744,444 H790 A10,10 0 0 1 800,454 V604 A10,10 0 0 1 790,614 H744 Z" fill="#4a2f8a"/>
<text transform="translate(762,529.0) rotate(90)" text-anchor="middle" font-size="30" font-weight="800" letter-spacing="5" font-family="Segoe UI, Arial, sans-serif" fill="#FFFFFF">DAYS</text>
<text x="36" y="74" font-size="11.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1a3a5c" text-anchor="start">TURN · Reason</text>
<text x="736" y="74" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#1a3a5c" text-anchor="end" font-style="italic">Store: the model's context · the LLM works only here</text>
<text x="36" y="286" font-size="11.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#085041" text-anchor="start">SESSION · Remember</text>
<text x="640" y="286" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#085041" text-anchor="end" font-style="italic">Store: the record · Check: the person and a second look</text>
<text x="36" y="468" font-size="11.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#2e1060" text-anchor="start">RULES · Learn</text>
<text x="736" y="468" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2e1060" text-anchor="end" font-style="italic">Store: instructions and skills · Check: the person's review</text>
<rect x="36" y="90" width="120" height="64" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/>
<text x="96.0" y="112" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#712B13" text-anchor="middle">Request</text>
<text x="96.0" y="130" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2C2C2A" text-anchor="middle">from the person</text>
<rect x="192" y="90" width="150" height="64" rx="8" fill="#dce8f5" stroke="#2d6eaa" stroke-width="2.2"/>
<text x="267.0" y="112" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1a3a5c" text-anchor="middle">LLM</text>
<text x="267.0" y="130" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2C2C2A" text-anchor="middle">proposes an answer,</text>
<text x="267.0" y="145" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2C2C2A" text-anchor="middle">draft, or tool call</text>
<rect x="378" y="90" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#2d6eaa" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="453.0" y="112" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1a3a5c" text-anchor="middle">Check</text>
<text x="453.0" y="130" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2C2C2A" text-anchor="middle">tests or tools,</text>
<text x="453.0" y="145" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2C2C2A" text-anchor="middle">where they exist</text>
<rect x="564" y="90" width="120" height="64" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="624.0" y="112" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#2C2C2A" text-anchor="middle">Response</text>
<text x="624.0" y="130" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2C2C2A" text-anchor="middle">or draft</text>
<path d="M156,122 L190,122" fill="none" stroke="#D85A30" stroke-width="1.8" marker-end="url(#arr-orange)"/>
<path d="M342,122 L376,122" fill="none" stroke="#2d6eaa" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-blue)"/>
<path d="M528,122 L562,122" fill="none" stroke="#2d6eaa" stroke-width="1.8" marker-end="url(#arr-blue)"/>
<path d="M300,154 L300,190 L594,190 L594,156" fill="none" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#arr-gray)"/>
<text x="447" y="208" font-size="9.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#5F5E5A" text-anchor="middle" font-style="italic">no automatic check: straight to the person</text>
<path d="M654,154 L654,300" fill="none" stroke="#D85A30" stroke-width="1.8" marker-end="url(#arr-orange)"/>
<text x="662" y="236" font-size="9.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#712B13" text-anchor="start" font-style="italic">for review</text>
<path d="M220,302 L220,156" fill="none" stroke="#1D9E75" stroke-width="1.8" marker-end="url(#arr-green)"/>
<text x="228" y="236" font-size="9.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#085041" text-anchor="start" font-style="italic">read at the start of every turn</text>
<rect x="36" y="302" width="200" height="90" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
<text x="136.0" y="324" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#085041" text-anchor="middle">The record</text>
<text x="136.0" y="342" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2C2C2A" text-anchor="middle">settled, doubted, open</text>
<text x="136.0" y="357" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2C2C2A" text-anchor="middle">drafts and action trace</text>
<rect x="272" y="302" width="180" height="90" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="362.0" y="324" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#2C2C2A" text-anchor="middle">Checks</text>
<text x="362.0" y="342" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2C2C2A" text-anchor="middle">a fresh session,</text>
<text x="362.0" y="357" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2C2C2A" text-anchor="middle">a second model,</text>
<text x="362.0" y="372" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2C2C2A" text-anchor="middle">completeness checks</text>
<rect x="488" y="302" width="236" height="90" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/>
<text x="606.0" y="324" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#712B13" text-anchor="middle">The person reviews</text>
<text x="606.0" y="342" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2C2C2A" text-anchor="middle">accepts, revises, or rejects</text>
<text x="606.0" y="357" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2C2C2A" text-anchor="middle">the decision goes in the record</text>
<path d="M488,347 L454,347" fill="none" stroke="#D85A30" stroke-width="1.8" marker-end="url(#arr-orange)"/>
<path d="M272,347 L238,347" fill="none" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#arr-gray)"/>
<path d="M190,392 L190,482" fill="none" stroke="#1D9E75" stroke-width="1.8" marker-end="url(#arr-green)"/>
<text x="198" y="424" font-size="9.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#085041" text-anchor="start" font-style="italic">a lesson to keep</text>
<path d="M380,484 L380,412 L225,412 L225,394" fill="none" stroke="#5b3d9e" stroke-width="1.8" marker-end="url(#arr-purple)"/>
<text x="290" y="406" font-size="9.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2e1060" text-anchor="middle" font-style="italic">read each session</text>
<rect x="36" y="484" width="200" height="90" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/>
<text x="136.0" y="506" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#712B13" text-anchor="middle">The person reviews</text>
<text x="136.0" y="524" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2C2C2A" text-anchor="middle">what is worth keeping</text>
<text x="136.0" y="539" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2C2C2A" text-anchor="middle">as a standing rule</text>
<rect x="332" y="484" width="300" height="90" rx="8" fill="#e8e0f5" stroke="#5b3d9e" stroke-width="1.5"/>
<text x="482.0" y="506" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#2e1060" text-anchor="middle">Instructions and skills</text>
<text x="482.0" y="524" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2C2C2A" text-anchor="middle">standing rules each session reads</text>
<text x="482.0" y="539" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2C2C2A" text-anchor="middle">Only this loop writes here</text>
<path d="M236,529 L330,529" fill="none" stroke="#D85A30" stroke-width="1.8" marker-end="url(#arr-orange)"/>
<text x="20" y="640" font-size="9.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#5F5E5A" text-anchor="start">Dashed box: a check that exists only where an automatic test exists.</text>
<text x="20" y="654" font-size="9.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#5F5E5A" text-anchor="start">Completeness checks show the record is complete, not that it is right.</text>
<text x="20" y="668" font-size="9.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#5F5E5A" text-anchor="start">Each review by the person starts the next turn. Only the rules loop writes to instructions.</text>
</svg>
