<svg viewBox="0 0 980 440" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr-gray2" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0,7 3,0 6" fill="#64748b"/>
    </marker>
    <marker id="arr-purple2" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0,7 3,0 6" fill="#5b3d9e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="490" y="22" text-anchor="middle" font-size="15" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1e293b">Anatomy of an Agent - What's Actually AI Inside the Loop</text>
  <text x="490" y="38" text-anchor="middle" font-size="9.5" font-style="italic" font-family="Segoe UI, Arial, sans-serif" fill="#64748b">"Agent" is not a model type - it's software that calls a model repeatedly. See where the one model call actually happens below.</text>

  <!-- star callout above LLM box -->
  <text x="595" y="63" text-anchor="middle" font-size="9.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#5b3d9e">&#9733; The only model call in this entire loop</text>

  <!-- ============ TOP ROW ============ -->
  <!-- Task / Goal -->
  <rect x="30" y="70" width="160" height="90" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="110" y="98" text-anchor="middle" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Task / Goal</text>
  <text x="110" y="114" text-anchor="middle" font-size="9" font-style="italic" font-family="Segoe UI, Arial, sans-serif" fill="#64748b">(what the user wants)</text>
  <text x="110" y="132" text-anchor="middle" font-size="8.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#475569">Entry point -</text>
  <text x="110" y="144" text-anchor="middle" font-size="8.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#475569">not AI itself</text>

  <!-- Loop Controller -->
  <rect x="250" y="70" width="190" height="90" rx="8" fill="#f3f4f6" stroke="#64748b" stroke-width="1.5"/>
  <text x="345" y="98" text-anchor="middle" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Loop Controller</text>
  <text x="345" y="114" text-anchor="middle" font-size="9" font-style="italic" font-family="Segoe UI, Arial, sans-serif" fill="#64748b">(plain code)</text>
  <text x="345" y="130" text-anchor="middle" font-size="8.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#475569">Decides: call the model,</text>
  <text x="345" y="142" text-anchor="middle" font-size="8.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#475569">run a tool, or stop</text>
  <rect x="300" y="149" width="90" height="14" rx="7" fill="#94a3b8"/>
  <text x="345" y="159.5" text-anchor="middle" font-size="7" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#ffffff">SOFTWARE</text>

  <!-- LLM (the model) -->
  <rect x="500" y="70" width="190" height="90" rx="8" fill="#e8e0f5" stroke="#5b3d9e" stroke-width="2"/>
  <text x="595" y="98" text-anchor="middle" font-size="13" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#2e1060">LLM</text>
  <text x="595" y="114" text-anchor="middle" font-size="9" font-style="italic" font-family="Segoe UI, Arial, sans-serif" fill="#7a5fb0">(the trained model)</text>
  <text x="595" y="130" text-anchor="middle" font-size="8.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#4a2d8a">Generates the next step:</text>
  <text x="595" y="142" text-anchor="middle" font-size="8.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#4a2d8a">text, or a tool call</text>
  <rect x="555" y="149" width="80" height="14" rx="7" fill="#5b3d9e"/>
  <text x="595" y="159.5" text-anchor="middle" font-size="7" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#ffffff">GENERATIVE</text>

  <!-- Final Output -->
  <rect x="750" y="70" width="190" height="90" rx="8" fill="#f3f4f6" stroke="#64748b" stroke-width="1.5"/>
  <text x="845" y="98" text-anchor="middle" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Final Output</text>
  <text x="845" y="114" text-anchor="middle" font-size="9" font-style="italic" font-family="Segoe UI, Arial, sans-serif" fill="#64748b">(returned to user)</text>
  <text x="845" y="130" text-anchor="middle" font-size="8.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#475569">Loop exits -</text>
  <text x="845" y="142" text-anchor="middle" font-size="8.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#475569">plain code hands it back</text>
  <rect x="800" y="149" width="90" height="14" rx="7" fill="#94a3b8"/>
  <text x="845" y="159.5" text-anchor="middle" font-size="7" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#ffffff">SOFTWARE</text>

  <!-- ============ BOTTOM ROW ============ -->
  <!-- Memory / Context -->
  <rect x="250" y="250" width="190" height="90" rx="8" fill="#f3f4f6" stroke="#64748b" stroke-width="1.5"/>
  <text x="345" y="278" text-anchor="middle" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Memory / Context</text>
  <text x="345" y="294" text-anchor="middle" font-size="9" font-style="italic" font-family="Segoe UI, Arial, sans-serif" fill="#64748b">(conversation + results so far)</text>
  <text x="345" y="310" text-anchor="middle" font-size="8.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#475569">Stored state, fed back</text>
  <text x="345" y="322" text-anchor="middle" font-size="8.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#475569">to the model next turn</text>
  <rect x="300" y="329" width="90" height="14" rx="7" fill="#94a3b8"/>
  <text x="345" y="339.5" text-anchor="middle" font-size="7" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#ffffff">SOFTWARE</text>

  <!-- Tool Execution -->
  <rect x="500" y="250" width="190" height="90" rx="8" fill="#f3f4f6" stroke="#64748b" stroke-width="1.5"/>
  <text x="595" y="278" text-anchor="middle" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Tool Execution</text>
  <text x="595" y="294" text-anchor="middle" font-size="9" font-style="italic" font-family="Segoe UI, Arial, sans-serif" fill="#64748b">(API call, search, code run)</text>
  <text x="595" y="310" text-anchor="middle" font-size="8.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#475569">Usually plain software -</text>
  <text x="595" y="322" text-anchor="middle" font-size="8.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#475569">see branch at right &#8594;</text>
  <rect x="550" y="329" width="90" height="14" rx="7" fill="#94a3b8"/>
  <text x="595" y="339.5" text-anchor="middle" font-size="7" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#ffffff">SOFTWARE</text>

  <!-- Branch: a tool call can itself be another model call -->
  <line x1="690" y1="295" x2="750" y2="295" stroke="#5b3d9e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-purple2)"/>
  <text x="720" y="286" text-anchor="middle" font-size="7.5" font-style="italic" font-family="Segoe UI, Arial, sans-serif" fill="#5b3d9e">tool = LLM?</text>
  <rect x="750" y="250" width="190" height="90" rx="8" fill="#e8e0f5" stroke="#5b3d9e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="845" y="272" text-anchor="middle" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#2e1060">Sub-Agent Call</text>
  <text x="845" y="288" text-anchor="middle" font-size="9" font-style="italic" font-family="Segoe UI, Arial, sans-serif" fill="#7a5fb0">(a tool CAN be an LLM)</text>
  <text x="845" y="304" text-anchor="middle" font-size="8.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#4a2d8a">Coding agents do this -</text>
  <text x="845" y="316" text-anchor="middle" font-size="8.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#4a2d8a">draft, review, delegate</text>
  <rect x="805" y="323" width="80" height="14" rx="7" fill="#5b3d9e"/>
  <text x="845" y="333.5" text-anchor="middle" font-size="7" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#ffffff">GENERATIVE</text>

  <!-- ============ CONNECTORS ============ -->
  <line x1="190" y1="115" x2="250" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray2)"/>
  <line x1="440" y1="115" x2="500" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray2)"/>
  <line x1="690" y1="115" x2="750" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray2)"/>
  <text x="720" y="108" text-anchor="middle" font-size="8" font-style="italic" font-family="Segoe UI, Arial, sans-serif" fill="#5b3d9e">done</text>

  <line x1="595" y1="160" x2="595" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray2)"/>
  <text x="650" y="208" text-anchor="middle" font-size="8" font-style="italic" font-family="Segoe UI, Arial, sans-serif" fill="#5b3d9e">tool call needed</text>

  <line x1="500" y1="295" x2="440" y2="295" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray2)"/>

  <line x1="345" y1="250" x2="345" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray2)"/>
  <text x="290" y="208" text-anchor="middle" font-size="8" font-style="italic" font-family="Segoe UI, Arial, sans-serif" fill="#5b3d9e">next loop turn</text>

  <!-- ============ LEGEND / FOOTER ============ -->
  <rect x="295" y="356" width="16" height="16" fill="#e8e0f5" stroke="#5b3d9e" stroke-width="1.5"/>
  <text x="317" y="368" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#334155">AI / trained model</text>
  <rect x="470" y="356" width="16" height="16" fill="#f3f4f6" stroke="#64748b" stroke-width="1.5"/>
  <text x="492" y="368" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Ordinary software (orchestration, plumbing)</text>

  <text x="490" y="392" text-anchor="middle" font-size="9.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#64748b">Only the LLM box represents a trained model. Everything else - the loop, tool calls, memory -</text>
  <text x="490" y="405" text-anchor="middle" font-size="9.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#64748b">is ordinary code orchestrating repeated calls to that one model.</text>
  <text x="490" y="422" text-anchor="middle" font-size="9.5" font-style="italic" font-family="Segoe UI, Arial, sans-serif" fill="#5b3d9e">A "tool" isn't always software, though - it can be another model call (a sub-agent), as shown above.</text>
</svg>
