<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" role="img" aria-labelledby="ti de" style="background:#ffffff;font-family:'Segoe UI',Helvetica,Arial,sans-serif">
<title id="ti">Two ways to get a working system, 2015 and 2023</title>
<desc id="de">Upper track: three separate 2015 problems, each built from scratch as its own full column of stages, sharing nothing. Lower track: one pre-trained model, paid for once, with three thin adaptation branches descending from it.</desc>
<rect x="0" y="0" width="980" height="540" fill="#ffffff"/>
<text x="20" y="30" font-size="15" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1e293b">Two ways to get a working system, 2015 and 2023</text>

<text x="20" y="58" font-size="11" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#2e1060" letter-spacing="0.06em">2015 — THREE SEPARATE BUILDS, NO SHARED MACHINERY</text>

<g>
<rect x="20" y="72" width="280" height="204" rx="6" fill="#f0f4f8" stroke="#2d5270" stroke-width="1"/>
<text x="160" y="90" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1e3a52">Problem A</text>
<rect x="34" y="98" width="252" height="26" rx="3" fill="#dce8f5" stroke="#2d6eaa" stroke-width="0.75"/>
<text x="160" y="115" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">Data collection</text>
<rect x="34" y="130" width="252" height="26" rx="3" fill="#dce8f5" stroke="#2d6eaa" stroke-width="0.75"/>
<text x="160" y="147" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">Hand-chosen features</text>
<rect x="34" y="162" width="252" height="26" rx="3" fill="#dce8f5" stroke="#2d6eaa" stroke-width="0.75"/>
<text x="160" y="179" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">Labeling</text>
<rect x="34" y="194" width="252" height="26" rx="3" fill="#dce8f5" stroke="#2d6eaa" stroke-width="0.75"/>
<text x="160" y="211" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">Training</text>
<rect x="34" y="226" width="252" height="26" rx="3" fill="#dce8f5" stroke="#2d6eaa" stroke-width="0.75"/>
<text x="160" y="243" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">Serving</text>
</g>

<g>
<rect x="350" y="72" width="280" height="204" rx="6" fill="#f0f4f8" stroke="#2d5270" stroke-width="1"/>
<text x="490" y="90" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1e3a52">Problem B</text>
<rect x="364" y="98" width="252" height="26" rx="3" fill="#dce8f5" stroke="#2d6eaa" stroke-width="0.75"/>
<text x="490" y="115" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">Data collection</text>
<rect x="364" y="130" width="252" height="26" rx="3" fill="#dce8f5" stroke="#2d6eaa" stroke-width="0.75"/>
<text x="490" y="147" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">Hand-chosen features</text>
<rect x="364" y="162" width="252" height="26" rx="3" fill="#dce8f5" stroke="#2d6eaa" stroke-width="0.75"/>
<text x="490" y="179" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">Labeling</text>
<rect x="364" y="194" width="252" height="26" rx="3" fill="#dce8f5" stroke="#2d6eaa" stroke-width="0.75"/>
<text x="490" y="211" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">Training</text>
<rect x="364" y="226" width="252" height="26" rx="3" fill="#dce8f5" stroke="#2d6eaa" stroke-width="0.75"/>
<text x="490" y="243" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">Serving</text>
</g>

<g>
<rect x="680" y="72" width="280" height="204" rx="6" fill="#f0f4f8" stroke="#2d5270" stroke-width="1"/>
<text x="820" y="90" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1e3a52">Problem C</text>
<rect x="694" y="98" width="252" height="26" rx="3" fill="#dce8f5" stroke="#2d6eaa" stroke-width="0.75"/>
<text x="820" y="115" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">Data collection</text>
<rect x="694" y="130" width="252" height="26" rx="3" fill="#dce8f5" stroke="#2d6eaa" stroke-width="0.75"/>
<text x="820" y="147" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">Hand-chosen features</text>
<rect x="694" y="162" width="252" height="26" rx="3" fill="#dce8f5" stroke="#2d6eaa" stroke-width="0.75"/>
<text x="820" y="179" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">Labeling</text>
<rect x="694" y="194" width="252" height="26" rx="3" fill="#dce8f5" stroke="#2d6eaa" stroke-width="0.75"/>
<text x="820" y="211" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">Training</text>
<rect x="694" y="226" width="252" height="26" rx="3" fill="#dce8f5" stroke="#2d6eaa" stroke-width="0.75"/>
<text x="820" y="243" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">Serving</text>
</g>

<text x="20" y="300" font-size="9.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#5f5e5a">No column shares a box with another. Each problem is built end to end, alone.</text>

<text x="20" y="336" font-size="11" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#2e1060" letter-spacing="0.06em">2023 — ONE MODEL PAID FOR ONCE, THIN ADAPTATIONS</text>

<rect x="20" y="352" width="940" height="50" rx="6" fill="#e8e0f5" stroke="#5b3d9e" stroke-width="1.5"/>
<text x="490" y="382" text-anchor="middle" font-size="11" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#2e1060">Pre-trained model — paid for once</text>

<line x1="180" y1="402" x2="120" y2="452" stroke="#5b3d9e" stroke-width="1.5"/>
<line x1="490" y1="402" x2="490" y2="452" stroke="#5b3d9e" stroke-width="1.5"/>
<line x1="800" y1="402" x2="860" y2="452" stroke="#5b3d9e" stroke-width="1.5"/>

<rect x="40" y="452" width="160" height="50" rx="6" fill="#f0f4f8" stroke="#2d5270" stroke-width="1"/>
<text x="120" y="472" text-anchor="middle" font-size="8.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1e3a52">Task examples</text>
<text x="120" y="486" text-anchor="middle" font-size="8.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">+ serving path A</text>

<rect x="410" y="452" width="160" height="50" rx="6" fill="#f0f4f8" stroke="#2d5270" stroke-width="1"/>
<text x="490" y="472" text-anchor="middle" font-size="8.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1e3a52">Task examples</text>
<text x="490" y="486" text-anchor="middle" font-size="8.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">+ serving path B</text>

<rect x="780" y="452" width="160" height="50" rx="6" fill="#f0f4f8" stroke="#2d5270" stroke-width="1"/>
<text x="860" y="472" text-anchor="middle" font-size="8.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1e3a52">Task examples</text>
<text x="860" y="486" text-anchor="middle" font-size="8.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">+ serving path C</text>

<text x="20" y="524" font-size="9.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#5f5e5a">The point is the shared block and the thinness of the branches, not any stated quantity of cost.</text>
</svg>
