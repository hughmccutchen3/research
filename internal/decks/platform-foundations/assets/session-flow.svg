<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="980" height="340">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#2d6eaa"/>
    </marker>
    <marker id="arr-red-down" markerWidth="10" markerHeight="8" refX="4" refY="7" orient="auto">
      <polygon points="0 0,8 0,4 8" fill="#b03030"/>
    </marker>
    <marker id="arr-red3" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0,10 4,0 8" fill="#b03030"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="340" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#0F172A">How a session is supposed to run</text>
  <text x="20" y="52" font-size="10.5" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#475569">Designed end to end. The four numbered drops into the canonical store were the hard part.</text>

  <rect x="20" y="76" width="138" height="100" rx="6" fill="#dce8f5" stroke="#2d6eaa" stroke-width="1.5"/>
  <text x="89" y="102" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1a3a5c">OPEN GATE</text>
  <text x="89" y="126" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">open_verify.py</text>
  <text x="89" y="140" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">mounts · profile</text>
  <text x="89" y="154" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">skills declared</text>

  <rect x="180" y="76" width="138" height="100" rx="6" fill="#dce8f5" stroke="#2d6eaa" stroke-width="1.5"/>
  <text x="249" y="102" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1a3a5c">LOAD</text>
  <text x="249" y="126" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">skills + docs</text>
  <text x="249" y="140" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">scan the library</text>
  <text x="249" y="154" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">read the handoff</text>

  <rect x="340" y="76" width="138" height="100" rx="6" fill="#dce8f5" stroke="#2d6eaa" stroke-width="1.5"/>
  <text x="409" y="102" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1a3a5c">WORK</text>
  <text x="409" y="126" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">the actual task</text>
  <text x="409" y="140" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">write to the tree</text>
  <text x="409" y="154" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">commit as you go</text>

  <rect x="500" y="76" width="138" height="100" rx="6" fill="#dce8f5" stroke="#2d6eaa" stroke-width="1.5"/>
  <text x="569" y="102" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1a3a5c">CLOSE GATE</text>
  <text x="569" y="126" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">close_verify.py</text>
  <text x="569" y="140" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">18 checks</text>
  <text x="569" y="154" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">emits tasks</text>

  <rect x="660" y="76" width="138" height="100" rx="6" fill="#dce8f5" stroke="#2d6eaa" stroke-width="1.5"/>
  <text x="729" y="102" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1a3a5c">LOG + HANDOFF</text>
  <text x="729" y="126" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">close log</text>
  <text x="729" y="140" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">ledger rows</text>
  <text x="729" y="154" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">handoff brief</text>

  <rect x="820" y="76" width="138" height="100" rx="6" fill="#dce8f5" stroke="#2d6eaa" stroke-width="1.5"/>
  <text x="889" y="102" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#1a3a5c">NEXT SESSION</text>
  <text x="889" y="126" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">opens the handoff</text>
  <text x="889" y="140" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">carries context</text>
  <text x="889" y="154" text-anchor="middle" font-size="9" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#2c4a6e">no re-explaining</text>

  <line x1="158" y1="126" x2="178" y2="126" stroke="#2d6eaa" stroke-width="1.8"/>
  <line x1="318" y1="126" x2="338" y2="126" stroke="#2d6eaa" stroke-width="1.8"/>
  <line x1="478" y1="126" x2="498" y2="126" stroke="#2d6eaa" stroke-width="1.8"/>
  <line x1="638" y1="126" x2="658" y2="126" stroke="#2d6eaa" stroke-width="1.8"/>
  <line x1="798" y1="126" x2="818" y2="126" stroke="#2d6eaa" stroke-width="1.8"/>
  <circle cx="158" cy="126" r="3" fill="#2d6eaa"/>
  <circle cx="178" cy="126" r="3" fill="#2d6eaa"/>
  <circle cx="318" cy="126" r="3" fill="#2d6eaa"/>
  <circle cx="338" cy="126" r="3" fill="#2d6eaa"/>
  <circle cx="478" cy="126" r="3" fill="#2d6eaa"/>
  <circle cx="498" cy="126" r="3" fill="#2d6eaa"/>
  <circle cx="638" cy="126" r="3" fill="#2d6eaa"/>
  <circle cx="658" cy="126" r="3" fill="#2d6eaa"/>
  <circle cx="798" cy="126" r="3" fill="#2d6eaa"/>
  <circle cx="818" cy="126" r="3" fill="#2d6eaa"/>

  <line x1="89" y1="176" x2="89" y2="222" stroke="#b03030" stroke-width="4"/>
  <circle cx="89" cy="176" r="4" fill="#b03030"/>
  <circle cx="89" cy="222" r="4" fill="#b03030"/>
  <circle cx="89" cy="200" r="10" fill="#b03030"/>
  <text x="89" y="204" text-anchor="middle" font-size="10" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#ffffff">1</text>
  <line x1="409" y1="176" x2="409" y2="222" stroke="#b03030" stroke-width="4"/>
  <circle cx="409" cy="176" r="4" fill="#b03030"/>
  <circle cx="409" cy="222" r="4" fill="#b03030"/>
  <circle cx="409" cy="200" r="10" fill="#b03030"/>
  <text x="409" y="204" text-anchor="middle" font-size="10" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#ffffff">2</text>
  <line x1="569" y1="176" x2="569" y2="222" stroke="#b03030" stroke-width="4"/>
  <circle cx="569" cy="176" r="4" fill="#b03030"/>
  <circle cx="569" cy="222" r="4" fill="#b03030"/>
  <circle cx="569" cy="200" r="10" fill="#b03030"/>
  <text x="569" y="204" text-anchor="middle" font-size="10" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#ffffff">3</text>
  <line x1="729" y1="176" x2="729" y2="222" stroke="#b03030" stroke-width="4"/>
  <circle cx="729" cy="176" r="4" fill="#b03030"/>
  <circle cx="729" cy="222" r="4" fill="#b03030"/>
  <circle cx="729" cy="200" r="10" fill="#b03030"/>
  <text x="729" y="204" text-anchor="middle" font-size="10" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#ffffff">4</text>

  <rect x="20" y="226" width="938" height="64" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/>
  <text x="489" y="250" text-anchor="middle" font-size="11" font-weight="700" font-family="Segoe UI, Arial, sans-serif" fill="#5a3e00">ONE CANONICAL STORE — every stage reads from and writes to the same tree</text>
  <text x="489" y="271" text-anchor="middle" font-size="10" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#5a3e00">append-only ledger · project registry · artifact manifest · session logs · handoffs · governing docs</text>

  <text x="20" y="314" font-size="9.5" font-style="italic" font-weight="400" font-family="Segoe UI, Arial, sans-serif" fill="#64748b">Nothing here is aspirational. Every box names a script, a skill, or a file that exists today.</text>
</svg>
