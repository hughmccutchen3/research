<svg width="700" height="450" viewBox="0 0 700 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t7 d7" font-family="Segoe UI, Arial, sans-serif" style="background:#ffffff"><title id="t7">Memory management — encode and retrieve, with the research version chain</title><desc id="d7">Session N encodes by checker-verified writes into the written corpus; session N plus one retrieves via the emitted prompt and librarian loading paths; research memory is the version chain of the work; hygiene band lists governing rules.</desc>
<defs><marker id="r1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0f766e"/></marker></defs>
<rect x="30" y="20" width="250" height="56" rx="4" fill="#edeae4" stroke="#8a857c"/>
<text x="155" y="40" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#1f1d1a">Session N — context window</text>
<text x="155" y="60" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5b564e">perfect literacy, in session only</text>
<rect x="420" y="20" width="250" height="56" rx="4" fill="#edeae4" stroke="#8a857c"/>
<text x="545" y="40" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#1f1d1a">Session N+1 — context window</text>
<text x="545" y="60" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5b564e">opens knowing nothing</text>
<line x1="284" y1="48" x2="416" y2="48" stroke="#d6d1c8" stroke-dasharray="4 4"/>
<text x="350" y="34" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#8a857c">total amnesia</text>
<path d="M 155 76 L 155 142" fill="none" stroke="#0f766e" marker-end="url(#r1)"/>
<text x="60" y="96" dominant-baseline="central" font-size="12" fill="#0f766e">encode = write at close</text>
<text x="60" y="114" dominant-baseline="central" font-size="11.5" fill="#5b564e">checker verifies on disk</text>
<path d="M 545 142 L 545 82" fill="none" stroke="#0f766e" marker-end="url(#r1)"/>
<text x="558" y="100" dominant-baseline="central" font-size="12" fill="#0f766e">retrieve = load at open</text>
<text x="558" y="118" dominant-baseline="central" font-size="11.5" fill="#5b564e">prompt names the chain</text>
<rect x="30" y="146" width="640" height="176" rx="4" fill="none" stroke="#8a857c"/>
<text x="350" y="166" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#1f1d1a">The memory — the written corpus</text>
<rect x="46" y="184" width="146" height="64" rx="4" fill="#f7f5f2" stroke="#d6d1c8"/>
<text x="119" y="202" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#1f1d1a">The work itself</text>
<text x="119" y="221" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5b564e">every version, chained</text>
<text x="119" y="238" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5b564e">manifest = index</text>
<rect x="204" y="184" width="146" height="64" rx="4" fill="#f7f5f2" stroke="#d6d1c8"/>
<text x="277" y="202" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#1f1d1a">System state</text>
<text x="277" y="221" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5b564e">ledger, logs, handoffs</text>
<text x="277" y="238" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5b564e">registry, findings</text>
<rect x="362" y="184" width="146" height="64" rx="4" fill="#f7f5f2" stroke="#d6d1c8"/>
<text x="435" y="202" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#1f1d1a">Linear</text>
<text x="435" y="221" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5b564e">mutable state</text>
<text x="435" y="238" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5b564e">closure machinery</text>
<rect x="520" y="184" width="134" height="64" rx="4" fill="#f7f5f2" stroke="#d6d1c8"/>
<text x="587" y="202" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#1f1d1a">Rules &amp; memories</text>
<text x="587" y="221" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5b564e">skills, profile</text>
<text x="587" y="238" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5b564e">auto + project memory</text>
<text x="350" y="274" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5b564e">research memory = the version chain of the work being built · supersede notes mandatory on stale versions</text>
<text x="350" y="298" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5b564e">entry + loading paths owned by the Librarian, measured M3/M4 · reference never replicate</text>
<rect x="30" y="342" width="640" height="76" rx="4" fill="#f7f5f2" stroke="#d6d1c8"/>
<text x="350" y="362" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#1f1d1a">Memory hygiene</text>
<text x="350" y="384" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5b564e">append-only, corrections supersede · manifest latest-per-id resolves current · staleness has an owner</text>
<text x="350" y="402" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5b564e">boundary sweep mines, files tickets — no standing records · doc rules advisory unless machine-checked</text>
</svg>